name: Docker Deploy Sample App 🐳

on:
  push:
    branches: [master]
    paths:
      - 'solr-spring-boot-sample/**'
      - 'solr-spring-boot-autoconfigure/**'
      - 'solr-spring-boot-starter/**'
      - '.github/workflows/deploy-sample.yml'

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/spring-data-solr-bookstore
  SOLR_IMAGE: ghcr.io/${{ github.repository_owner }}/spring-data-solr-solr10

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Spring Boot app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: solr-spring-boot-sample/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push custom Solr image
        uses: docker/build-push-action@v7
        with:
          context: solr-spring-boot-sample/solr-config
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.SOLR_IMAGE }}:latest
            ${{ env.SOLR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
