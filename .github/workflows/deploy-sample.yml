name: Publish sample app images

on:
  push:
    branches: [master]
    paths:
      - 'solr-spring-boot-sample/**'
      - 'solr-spring-boot-autoconfigure/**'
      - 'solr-spring-boot-starter/**'
      - '.github/workflows/deploy-sample.yml'

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/spring-data-solr-sample
  SOLR_IMAGE: ghcr.io/${{ github.repository_owner }}/spring-data-solr-solr

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and install library JARs (skip tests)
        run: ./mvnw install -pl solr-spring-boot-autoconfigure,solr-spring-boot-starter -DskipTests -q

      - name: Build and push Spring Boot app image (buildpacks)
        run: |
          ./mvnw spring-boot:build-image \
            -pl solr-spring-boot-sample \
            -DskipTests \
            -Dspring-boot.build-image.imageName=${{ env.APP_IMAGE }}:latest \
            -Dspring-boot.build-image.publish=true \
            -Dspring-boot.build-image.publishRegistry.url=${{ env.REGISTRY }} \
            -Dspring-boot.build-image.publishRegistry.username=${{ github.actor }} \
            -Dspring-boot.build-image.publishRegistry.password=${{ secrets.GITHUB_TOKEN }}

      - name: Build and push custom Solr image
        uses: docker/build-push-action@v5
        with:
          context: solr-spring-boot-sample/solr-config
          push: true
          tags: |
            ${{ env.SOLR_IMAGE }}:latest
            ${{ env.SOLR_IMAGE }}:${{ github.sha }}
