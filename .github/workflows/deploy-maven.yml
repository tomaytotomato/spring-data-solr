name: Deploy Maven 📦

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Maven Central credentials
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: '[{"id": "central", "username": "${{ secrets.MAVEN_USERNAME }}", "password": "${{ secrets.MAVEN_PASSWORD }}"}]'

      - name: Set release version from tag
        run: ./mvnw versions:set -DnewVersion="${GITHUB_REF#refs/tags/}" --batch-mode

      - name: Publish to Maven Central
        run: ./mvnw deploy -P release -DskipTests --batch-mode -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"
