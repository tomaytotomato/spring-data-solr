spring:
  application:
    name: solr-sample
  docker:
    compose:
      enabled: false
  solr:
    standalone:
      host: ${SPRING_SOLR_STANDALONE_HOST:${SOLR_URL:http://localhost:8983/solr}}
      default-collection: books
    commit-mode: immediate

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    solr:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      readiness:
        wait: always
